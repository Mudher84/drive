<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yam Notes Pro</title><style>:root{--r:#e62825;--rd:#a8171b;--ink:#171719;--g:#707075;--line:#e5e5e8;--bg:#f6f6f7;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.app{min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:20;background:#f6f6f7ee;backdrop-filter:blur(16px);padding:max(10px,env(safe-area-inset-top)) 15px 9px}.brand{height:54px;display:flex;align-items:center;justify-content:space-between}.brandMain{display:flex;align-items:center;gap:10px}.brand img{width:34px;height:42px}.brand strong{font-size:21px}.brand strong i{font-style:normal;color:var(--r)}.menu{border:0;background:transparent;font-size:24px}.search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 5px 20px #0000000a}.search input{border:0;outline:0;background:transparent;width:100%}.chips{display:flex;gap:7px;padding:11px 15px 2px;overflow:auto}.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap}.chip.on{background:var(--r);border-color:var(--r);color:#fff}.content{padding:13px 15px}.heading{display:flex;justify-content:space-between;align-items:center;margin:5px 1px 12px}.heading h2{font-size:18px;margin:0}.heading small{color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{position:relative;border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px;min-height:145px;box-shadow:0 4px 14px #00000008}.note.red{background:#fff0f0}.note.gray{background:#e9e9ec}.note.yellow{background:#fff7d8}.note h3{margin:0 0 8px;padding-left:22px;font-size:15px}.note p{margin:0;font-size:13px;line-height:1.65;color:#4c4c51;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.pin{position:absolute;top:9px;left:8px;border:0;background:none;color:var(--r);font-size:18px}.meta{position:absolute;bottom:10px;right:13px;left:13px;display:flex;gap:6px;font-size:10px;color:#777}.tag{background:#fff9;border-radius:99px;padding:2px 6px}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d2d2d5;border-radius:20px;text-align:center;padding:46px 20px;color:#777}.empty img{width:45px;height:55px;opacity:.45}.fab{position:fixed;z-index:30;left:22px;bottom:max(82px,calc(env(safe-area-inset-bottom) + 78px));width:58px;height:58px;border:0;border-radius:19px;background:linear-gradient(145deg,var(--r),var(--rd));color:#fff;font-size:30px;box-shadow:0 12px 30px #a8171b55}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 5px max(7px,env(safe-area-inset-bottom))}.nav{border:0;background:none;color:#777;font-size:10px}.nav b{display:block;font-size:20px;font-weight:400}.nav.on{color:var(--r)}.sheet{position:fixed;inset:0;z-index:70;background:#0005;display:none;align-items:flex-end}.sheet.show{display:flex}.panel{width:100%;max-height:95vh;overflow:auto;background:#fff;border-radius:27px 27px 0 0;padding:15px 16px max(18px,env(safe-area-inset-bottom))}.phead{display:flex;justify-content:space-between;align-items:center}.phead h2{margin:4px 0;font-size:19px}.icon{border:0;background:#f0f0f2;border-radius:12px;width:42px;height:42px}.save{border:0;background:var(--r);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700}.title,.body{width:100%;border:0;outline:0;background:transparent}.title{font-size:21px;font-weight:800;padding:15px 2px 8px}.body{font-size:16px;line-height:1.8;min-height:220px;resize:none;padding:8px 2px}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line);padding-top:11px}.tool{border:0;background:#f4f4f5;border-radius:12px;padding:10px 4px;font-size:11px}.colors{display:flex;gap:10px;margin:14px 2px}.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc}.sw.on{box-shadow:0 0 0 2px var(--r)}.drawer{position:fixed;z-index:90;inset:0;background:#0005;display:none}.drawer.show{display:block}.drawerBox{height:100%;width:min(82%,330px);margin-right:0;background:#fff;padding:max(22px,env(safe-area-inset-top)) 16px 20px;box-shadow:-20px 0 50px #0002}.dbrand{text-align:center;padding:10px}.dbrand img{height:62px}.dbrand h2{margin:5px}.ditem{width:100%;border:0;background:none;text-align:right;padding:13px;border-radius:12px;margin:2px 0}.ditem.on{background:#fff0f0;color:var(--r);font-weight:700}.settings{display:grid;gap:9px}.setting{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px}.toast{position:fixed;z-index:120;left:50%;bottom:100px;transform:translateX(-50%);background:#1b1b1e;color:#fff;padding:10px 16px;border-radius:99px;display:none}.toast.show{display:block}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.top,.chips,.content{max-width:900px;margin:auto}.panel{max-width:720px;margin:auto}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="brandMain"><img src="yam-logo.svg"><strong><i>Yam</i> Notes</strong></div><button class="menu" id="menu">☰</button></div><div class="search">⌕<input id="search" placeholder="ابحث في العناوين والمحتوى..."></div></header><div class="chips"><button class="chip on" data-filter="all">الكل</button><button class="chip" data-filter="pinned">المثبتة</button><button class="chip" data-filter="tasks">المهام</button><button class="chip" data-filter="red">الحمراء</button><button class="chip" data-filter="gray">الرمادية</button></div><main class="content"><div class="heading"><h2 id="heading">كل الملاحظات</h2><small id="count"></small></div><section class="grid" id="grid"></section></main><button class="fab" id="add">+</button><nav class="bottom"><button class="nav on" data-view="notes"><b>▤</b>الملاحظات</button><button class="nav" data-view="reminders"><b>◷</b>التذكيرات</button><button class="nav" data-view="archive"><b>▣</b>الأرشيف</button><button class="nav" data-view="more"><b>☰</b>المزيد</button></nav></div><div class="sheet" id="sheet"><div class="panel"><div class="phead"><button class="icon" id="close">×</button><h2 id="editTitle">ملاحظة جديدة</h2><button class="save" id="save">حفظ ✓</button></div><input class="title" id="title" placeholder="عنوان الملاحظة"><textarea class="body" id="body" placeholder="اكتب ملاحظتك هنا..."></textarea><div class="tools"><button class="tool" id="pin">☆ تثبيت</button><button class="tool" id="task">☑ قائمة مهام</button><button class="tool" id="label">◇ تصنيف</button><button class="tool" id="remind">◷ تذكير</button><button class="tool" id="archive">▣ أرشفة</button><button class="tool" id="trash">⌫ حذف</button><button class="tool" id="share">↗ مشاركة</button><button class="tool" id="copy">▢ نسخ</button></div><div class="colors"><button class="sw" data-color="white" style="background:white"></button><button class="sw" data-color="red" style="background:#ffdede"></button><button class="sw" data-color="gray" style="background:#d8d8dc"></button><button class="sw" data-color="yellow" style="background:#ffe89b"></button></div></div></div><div class="drawer" id="drawer"><div class="drawerBox"><div class="dbrand"><img src="yam-logo.svg"><h2><span style="color:var(--r)">Yam</span> Notes</h2><small>ملاحظاتك .. بشكل أذكى</small></div><button class="ditem on" data-go="notes">▤ كل الملاحظات</button><button class="ditem" data-go="pinned">☆ المثبتة</button><button class="ditem" data-go="reminders">◷ التذكيرات</button><button class="ditem" data-go="archive">▣ الأرشيف</button><button class="ditem" data-go="trash">⌫ المحذوفات</button><button class="ditem" data-go="settings">⚙ الإعدادات</button></div></div><div class="toast" id="toast"></div><script>const KEY='yam.notes.pro.v2';let edit=null,view='notes',filter='all',color='white',pinned=false,isTask=false;const $=x=>document.getElementById(x);function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a))}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1300)}function date(t){return new Date(t).toLocaleDateString('ar-IQ',{month:'short',day:'numeric'})}function filtered(n){if(view==='notes'&&(n.archived||n.trashed))return false;if(view==='archive'&&(!n.archived||n.trashed))return false;if(view==='trash'&&!n.trashed)return false;if(view==='reminders'&&!n.reminder)return false;if(filter==='pinned'&&!n.pinned)return false;if(filter==='tasks'&&!n.task)return false;if(['red','gray'].includes(filter)&&n.color!==filter)return false;let q=$('search').value.trim().toLowerCase();return !q||(n.title+' '+n.text+' '+(n.label||'')).toLowerCase().includes(q)}function render(){let a=load().filter(filtered).sort((a,b)=>(b.pinned-a.pinned)||(b.updated-a.updated));let names={notes:'كل الملاحظات',archive:'الأرشيف',trash:'المحذوفات',reminders:'التذكيرات'};$('heading').textContent=names[view]||'كل الملاحظات';$('count').textContent=a.length?a.length+' ملاحظة':'';$('grid').innerHTML=a.length?a.map(n=>`<article class="note ${n.color||''}" onclick="openNote('${n.id}')"><button class="pin" onclick="event.stopPropagation();quickPin('${n.id}')">${n.pinned?'★':'☆'}</button><h3>${esc(n.title||'ملاحظة')}</h3><p>${n.task?'☑ ':''}${esc(n.text)}</p><div class="meta">${n.label?`<span class="tag">${esc(n.label)}</span>`:''}${n.reminder?'<span>◷ تذكير</span>':''}<span>${date(n.updated)}</span></div></article>`).join(''):`<div class="empty"><img src="yam-logo.svg"><p>ماكو ملاحظات هنا بعد</p><small>اضغط + حتى تضيف أول فكرة</small></div>`}function openEditor(n){edit=n?.id||null;color=n?.color||'white';pinned=!!n?.pinned;isTask=!!n?.task;$('title').value=n?.title||'';$('body').value=n?.text||'';$('editTitle').textContent=n?'تعديل الملاحظة':'ملاحظة جديدة';$('pin').textContent=pinned?'★ مثبتة':'☆ تثبيت';$('task').textContent=isTask?'☑ قائمة مهام':'☐ قائمة مهام';document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.color===color));$('sheet').classList.add('show')}function openNote(id){let n=load().find(x=>String(x.id)===String(id));if(n)openEditor(n)}function close(){$('sheet').classList.remove('show')}function store(){let title=$('title').value.trim(),text=$('body').value.trim();if(!title&&!text)return toast('اكتب ملاحظة أولاً');let a=load(),now=Date.now();if(edit){let i=a.findIndex(x=>String(x.id)===String(edit));if(i>=0)a[i]={...a[i],title,text,color,pinned,task:isTask,updated:now}}else a.unshift({id:String(now),title,text,color,pinned,task:isTask,label:'',reminder:false,archived:false,trashed:false,created:now,updated:now});saveAll(a);close();render();toast('تم الحفظ')}function mutate(fn,msg){if(!edit)return toast('احفظ الملاحظة أولاً');let a=load(),i=a.findIndex(x=>String(x.id)===String(edit));if(i<0)return;fn(a[i]);a[i].updated=Date.now();saveAll(a);close();render();toast(msg)}function quickPin(id){let a=load(),i=a.findIndex(x=>String(x.id)===String(id));if(i>=0){a[i].pinned=!a[i].pinned;a[i].updated=Date.now();saveAll(a);render()}}function setView(v){view=v;filter='all';document.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('on',i===0));render();$('drawer').classList.remove('show')}$('add').onclick=()=>openEditor();$('close').onclick=close;$('sheet').onclick=e=>{if(e.target===$('sheet'))close()};$('save').onclick=store;$('pin').onclick=()=>{pinned=!pinned;$('pin').textContent=pinned?'★ مثبتة':'☆ تثبيت'};$('task').onclick=()=>{isTask=!isTask;$('task').textContent=isTask?'☑ قائمة مهام':'☐ قائمة مهام'};document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{color=s.dataset.color;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===s))});$('label').onclick=()=>{let v=prompt('اسم التصنيف');if(v!==null)mutate(n=>n.label=v.trim(),'تم التصنيف')};$('remind').onclick=()=>mutate(n=>n.reminder=!n.reminder,'تم تحديث التذكير');$('archive').onclick=()=>mutate(n=>n.archived=!n.archived,'تم تحديث الأرشيف');$('trash').onclick=()=>mutate(n=>n.trashed=!n.trashed,view==='trash'?'تم الاسترجاع':'تم النقل للمحذوفات');$('copy').onclick=()=>{navigator.clipboard?.writeText($('title').value+'\n'+$('body').value);toast('تم النسخ')};$('share').onclick=()=>{let text=$('title').value+'\n'+$('body').value;if(navigator.share)navigator.share({title:$('title').value,text});else toast('المشاركة متاحة حسب الجهاز')};$('search').oninput=render;document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));render()});document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{let v=n.dataset.view;if(v==='more'){$('drawer').classList.add('show');return}setView(v);document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x===n))});$('menu').onclick=()=>$('drawer').classList.add('show');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('show')};document.querySelectorAll('.ditem').forEach(d=>d.onclick=()=>{let g=d.dataset.go;if(g==='pinned'){view='notes';filter='pinned';$('drawer').classList.remove('show');render()}else if(g==='settings'){view='settings';$('drawer').classList.remove('show');$('heading').textContent='الإعدادات';$('count').textContent='';$('grid').innerHTML='<div class="empty" style="text-align:right"><h3>الإعدادات</h3><div class="settings"><div class="setting"><span>المظهر</span><b>فاتح</b></div><div class="setting"><span>اللغة</span><b>العربية</b></div><div class="setting"><span>قفل الملاحظات</span><b>قريباً</b></div><div class="setting"><span>النسخ الاحتياطي والاستعادة</span><b>محلي</b></div><div class="setting"><span>Yam Notes Pro</span><b>2.0</b></div></div></div>'}else setView(g)});render();</script></body></html>
