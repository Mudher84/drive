<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yam Notes Pro</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7fb;color:#17181c}.wrap{max-width:780px;margin:auto;padding:22px 16px 48px}.head{padding:24px;border-radius:24px;background:#111318;color:#fff;margin-bottom:16px;box-shadow:0 12px 36px #0002}.head h1{margin:0 0 8px;font-size:30px}.head p{margin:0;color:#cfd3da}.card{background:#fff;border:1px solid #e8eaf0;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 6px 24px #12152a0d}input,textarea{width:100%;border:1px solid #dfe2e9;border-radius:14px;padding:14px 15px;font:inherit;background:#fafbfc;outline:none}textarea{min-height:120px;resize:vertical}.row{display:flex;gap:10px;margin-top:10px}.btn{border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#111318;color:#fff;flex:1}.secondary{background:#eef0f4;color:#1b1d22}.danger{background:#fff0f0;color:#b42318}.status{min-height:24px;margin-top:10px;font-size:14px;color:#596174}.note{display:flex;gap:12px;align-items:flex-start}.noteText{white-space:pre-wrap;word-break:break-word;flex:1;line-height:1.7}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:#7d8491;padding:24px}.count{font-size:13px;color:#757c89;margin:8px 2px}.search{margin-bottom:10px}@media(max-width:520px){.note{display:block}.actions{margin-top:12px}.head h1{font-size:26px}}</style></head><body><div class="wrap"><section class="head"><h1>ملاحظاتي</h1><p>دوّن أفكارك بسرعة واحفظها محلياً على جهازك.</p></section><section class="card"><input id="search" class="search" placeholder="ابحث في الملاحظات"><textarea id="note" placeholder="اكتب ملاحظتك هنا"></textarea><div class="row"><button class="btn primary" id="save">حفظ الملاحظة</button><button class="btn secondary" id="clear">مسح الحقل</button></div><div id="status" class="status"></div></section><div id="count" class="count"></div><section id="list"></section></div><script>const KEY='yam.notes.pro.v1';let editing=null;const $=id=>document.getElementById(id);function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function persist(n){localStorage.setItem(KEY,JSON.stringify(n))}function msg(t){$('status').textContent=t;setTimeout(()=>{if($('status').textContent===t)$('status').textContent=''},1800)}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){const q=$('search').value.trim().toLowerCase();const notes=load();const filtered=notes.map((n,i)=>({...n,i})).filter(n=>!q||n.text.toLowerCase().includes(q));$('count').textContent=filtered.length?`${filtered.length} ملاحظة`:'';$('list').innerHTML=filtered.length?filtered.map(n=>`<article class="card note"><div class="noteText">${esc(n.text)}</div><div class="actions"><button class="btn secondary" onclick="editNote(${n.i})">تعديل</button><button class="btn danger" onclick="deleteNote(${n.i})">حذف</button></div></article>`).join(''):`<div class="card empty">${q?'لا توجد ملاحظات مطابقة':'لا توجد ملاحظات بعد'}</div>`}function save(){const v=$('note').value.trim();if(!v){msg('اكتب ملاحظة أولاً');return}const notes=load();if(editing!==null){notes[editing]={...notes[editing],text:v,updated:Date.now()};msg('تم تحديث الملاحظة')}else{notes.unshift({text:v,created:Date.now()});msg('تم حفظ الملاحظة')}persist(notes);editing=null;$('note').value='';render()}function editNote(i){const notes=load();if(!notes[i])return;editing=i;$('note').value=notes[i].text;$('note').focus();msg('وضع التعديل')}function deleteNote(i){const notes=load();notes.splice(i,1);persist(notes);if(editing===i){editing=null;$('note').value=''}msg('تم حذف الملاحظة');render()}$('save').onclick=save;$('clear').onclick=()=>{editing=null;$('note').value='';$('status').textContent=''};$('search').oninput=render;render();</script></body></html>
