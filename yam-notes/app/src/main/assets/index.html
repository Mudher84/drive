<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yam Notes</title><style>
:root{--red:#e62825;--red2:#951a1d;--ink:#171719;--gray:#6d6e72;--line:#e4e4e7;--bg:#f5f5f6;--card:#fff;--soft:#efeff1;--shadow:0 10px 28px rgba(22,22,24,.08)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.app{min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;background:rgba(245,245,246,.94);backdrop-filter:blur(14px);padding:max(12px,env(safe-area-inset-top)) 14px 10px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:12px}.brand img{width:34px;height:44px;object-fit:contain}.brand strong{font-size:21px;letter-spacing:-.4px}.brand span{color:var(--red)}.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 4px 18px #0000000a}.search input{border:0;outline:0;background:transparent;width:100%;font-size:15px}.toolbar{display:flex;gap:8px;padding:12px 14px 0;overflow:auto}.chip{white-space:nowrap;border:1px solid #ddd;background:#fff;color:#333;border-radius:999px;padding:8px 13px}.chip.active{background:var(--red);border-color:var(--red);color:#fff}.content{padding:14px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}.sectionTitle h2{font-size:18px;margin:0}.sectionTitle small{color:var(--gray)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.note{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:136px;box-shadow:0 5px 16px #00000008;overflow:hidden}.note[data-color="red"]{background:#fff2f2;border-color:#f4c9c9}.note[data-color="gray"]{background:#ececef}.note .pin{position:absolute;top:10px;left:10px;background:transparent;border:0;font-size:18px;color:var(--red)}.note h3{margin:0 0 8px;padding-left:24px;font-size:16px;line-height:1.4}.note p{margin:0;color:#4d4d52;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:11px;color:#777}.label{background:#fff;border:1px solid #ddd;border-radius:999px;padding:3px 7px}.empty{background:#fff;border:1px dashed #d4d4d8;border-radius:20px;padding:44px 20px;text-align:center;color:#777}.empty img{width:44px;height:58px;opacity:.5;margin-bottom:9px}.fab{position:fixed;z-index:30;left:22px;bottom:max(88px,calc(env(safe-area-inset-bottom) + 82px));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(145deg,var(--red),var(--red2));color:#fff;font-size:31px;box-shadow:0 12px 28px rgba(149,26,29,.28)}.bottom{position:fixed;z-index:25;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px max(8px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e5e5e7}.nav{border:0;background:transparent;color:#666;padding:5px;font-size:11px}.nav b{display:block;font-size:20px;font-weight:500;line-height:1.2;margin-bottom:2px}.nav.active{color:var(--red)}.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.33);display:none;align-items:flex-end}.overlay.show{display:flex}.editor{width:100%;max-height:94vh;background:#fff;border-radius:28px 28px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));box-shadow:0 -18px 55px #0003}.editorHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.iconBtn{width:42px;height:42px;border:0;border-radius:13px;background:var(--soft);color:#333}.saveBtn{border:0;border-radius:13px;padding:10px 18px;background:var(--red);color:#fff;font-weight:700}.titleInput,.bodyInput{width:100%;border:0;outline:0;background:transparent}.titleInput{font-size:22px;font-weight:800;padding:8px 3px}.bodyInput{font-size:16px;line-height:1.8;min-height:210px;max-height:42vh;resize:none;padding:8px 3px}.editorTools{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:flex;gap:8px;overflow:auto}.tool{white-space:nowrap;border:1px solid #dedee2;background:#fff;border-radius:13px;padding:9px 11px}.tool.on{color:var(--red);border-color:#efb3b2;background:#fff5f5}.colors{display:flex;gap:8px;margin-top:12px}.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc}.sw.sel{box-shadow:0 0 0 2px var(--red)}.toast{position:fixed;z-index:100;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);background:#1c1c1f;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.content,.top,.toolbar{max-width:900px;margin-left:auto;margin-right:auto}.editor{max-width:720px;margin:auto;border-radius:28px 28px 0 0}}
</style></head><body><div class="app"><header class="top"><div class="brand"><img src="yam-logo.svg" alt="Yam.lo"><strong><span>Yam</span> Notes</strong></div><div class="search"><span>⌕</span><input id="search" placeholder="ابحث في ملاحظاتك"></div></header><div class="toolbar"><button class="chip active" data-filter="all">الكل</button><button class="chip" data-filter="pinned">المثبتة</button><button class="chip" data-filter="red">الحمراء</button><button class="chip" data-filter="gray">الرمادية</button></div><main class="content"><div class="sectionTitle"><h2 id="viewTitle">كل الملاحظات</h2><small id="count"></small></div><section id="grid" class="grid"></section></main><button class="fab" id="add" aria-label="ملاحظة جديدة">+</button><nav class="bottom"><button class="nav active" data-view="notes"><b>▤</b>الملاحظات</button><button class="nav" data-view="reminders"><b>◷</b>التذكيرات</button><button class="nav" data-view="archive"><b>▣</b>الأرشيف</button><button class="nav" data-view="trash"><b>⌫</b>المحذوفات</button></nav></div>
<div id="overlay" class="overlay"><div class="editor"><div class="editorHead"><button class="iconBtn" id="close">×</button><div style="display:flex;gap:8px"><button class="iconBtn" id="pinBtn" title="تثبيت">♧</button><button class="saveBtn" id="save">حفظ</button></div></div><input id="title" class="titleInput" placeholder="عنوان الملاحظة"><textarea id="body" class="bodyInput" placeholder="اكتب ملاحظتك..."></textarea><div class="editorTools"><button class="tool" id="labelBtn">🏷 تصنيف</button><button class="tool" id="archiveBtn">▣ أرشفة</button><button class="tool" id="trashBtn">⌫ حذف</button></div><div class="colors"><button class="sw" data-color="white" style="background:#fff"></button><button class="sw" data-color="red" style="background:#fff1f1"></button><button class="sw" data-color="gray" style="background:#dedee2"></button></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='yam.notes.pro.v1';let editing=null,currentView='notes',filter='all',draftColor='white',draftPinned=false;const $=id=>document.getElementById(id);function raw(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function normalize(n,i){if(typeof n==='string')return{id:Date.now()+i,title:'',text:n,created:Date.now(),updated:Date.now(),pinned:false,color:'white',archived:false,trashed:false,label:''};return{id:n.id||Date.now()+i,title:n.title||'',text:n.text||'',created:n.created||Date.now(),updated:n.updated||n.created||Date.now(),pinned:!!n.pinned,color:n.color||'white',archived:!!n.archived,trashed:!!n.trashed,label:n.label||''}}function load(){return raw().map(normalize)}function persist(a){localStorage.setItem(KEY,JSON.stringify(a))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1400)}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(ts){return new Date(ts).toLocaleDateString('ar-IQ',{month:'short',day:'numeric'})}function visible(n){if(currentView==='notes'&&(n.archived||n.trashed))return false;if(currentView==='archive'&&(!n.archived||n.trashed))return false;if(currentView==='trash'&&!n.trashed)return false;if(currentView==='reminders')return false;if(filter==='pinned'&&!n.pinned)return false;if(filter==='red'&&n.color!=='red')return false;if(filter==='gray'&&n.color!=='gray')return false;const q=$('search').value.trim().toLowerCase();return !q||(n.title+' '+n.text+' '+n.label).toLowerCase().includes(q)}function render(){let notes=load().filter(visible);notes.sort((a,b)=>(b.pinned-a.pinned)||(b.updated-a.updated));$('count').textContent=notes.length?notes.length+' ملاحظة':'';const titles={notes:'كل الملاحظات',archive:'الأرشيف',trash:'المحذوفات',reminders:'التذكيرات'};$('viewTitle').textContent=titles[currentView];if(currentView==='reminders'){ $('grid').innerHTML='<div class="empty" style="grid-column:1/-1"><img src="yam-logo.svg"><div>التذكيرات الذكية راح تكون بالنسخة القادمة</div></div>';return}$('grid').innerHTML=notes.length?notes.map(n=>`<article class="note" data-id="${n.id}" data-color="${n.color}" onclick="openNote(${n.id})"><button class="pin" onclick="event.stopPropagation();togglePin(${n.id})">${n.pinned?'◆':'◇'}</button><h3>${esc(n.title||'ملاحظة')}</h3><p>${esc(n.text)}</p><div class="meta">${n.label?`<span class="label">${esc(n.label)}</span>`:''}<span>${fmt(n.updated)}</span>${n.archived?'<span>أرشيف</span>':''}</div></article>`).join(''):`<div class="empty" style="grid-column:1/-1"><img src="yam-logo.svg"><div>ماكو ملاحظات هنا بعد</div></div>`}function openEditor(n){editing=n?n.id:null;$('title').value=n?.title||'';$('body').value=n?.text||'';draftColor=n?.color||'white';draftPinned=!!n?.pinned;$('pinBtn').classList.toggle('on',draftPinned);$('pinBtn').textContent=draftPinned?'◆':'◇';$('archiveBtn').style.display=currentView==='trash'?'none':'';$('trashBtn').textContent=currentView==='trash'?'استرجاع':'⌫ حذف';document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('sel',x.dataset.color===draftColor));$('overlay').classList.add('show');setTimeout(()=>$('title').focus(),120)}function openNote(id){const n=load().find(x=>x.id===id);if(n)openEditor(n)}function closeEditor(){$('overlay').classList.remove('show')}function saveNote(){const title=$('title').value.trim(),text=$('body').value.trim();if(!title&&!text){toast('اكتب ملاحظة أولاً');return}let a=load(),now=Date.now();if(editing){let i=a.findIndex(x=>x.id===editing);if(i>=0)a[i]={...a[i],title,text,color:draftColor,pinned:draftPinned,updated:now}}else a.unshift({id:now,title,text,color:draftColor,pinned:draftPinned,label:'',created:now,updated:now,archived:false,trashed:false});persist(a);closeEditor();render();toast('تم الحفظ')}function togglePin(id){let a=load(),i=a.findIndex(x=>x.id===id);if(i>=0){a[i].pinned=!a[i].pinned;a[i].updated=Date.now();persist(a);render()}}function updateCurrent(fn,msg){if(!editing)return;let a=load(),i=a.findIndex(x=>x.id===editing);if(i<0)return;fn(a[i]);a[i].updated=Date.now();persist(a);closeEditor();render();toast(msg)}$('add').onclick=()=>openEditor(null);$('close').onclick=closeEditor;$('overlay').onclick=e=>{if(e.target.id==='overlay')closeEditor()};$('save').onclick=saveNote;$('pinBtn').onclick=()=>{draftPinned=!draftPinned;$('pinBtn').classList.toggle('on',draftPinned);$('pinBtn').textContent=draftPinned?'◆':'◇'};document.querySelectorAll('.sw').forEach(x=>x.onclick=()=>{draftColor=x.dataset.color;document.querySelectorAll('.sw').forEach(y=>y.classList.toggle('sel',y===x))});$('labelBtn').onclick=()=>{let v=prompt('اكتب اسم التصنيف');if(v!==null&&editing)updateCurrent(n=>n.label=v.trim(),'تم تحديث التصنيف')};$('archiveBtn').onclick=()=>updateCurrent(n=>n.archived=!n.archived,'تم نقل الملاحظة');$('trashBtn').onclick=()=>updateCurrent(n=>n.trashed=!n.trashed,currentView==='trash'?'تم الاسترجاع':'تم النقل للمحذوفات');$('search').oninput=render;document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===c));render()});document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{currentView=n.dataset.view;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===n));render()});render();
</script></body></html>
