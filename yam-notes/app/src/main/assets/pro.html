<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yam Notes Pro</title><style>:root{--red:#e62825;--red2:#951a1d;--bg:#f6f6f7;--card:#fff;--ink:#171719;--muted:#747479;--line:#e3e3e7;--soft:#eeeeF1}body.dark{--bg:#111214;--card:#1c1d20;--ink:#f7f7f8;--muted:#aaaab0;--line:#333438;--soft:#292a2e}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);transition:.2s}button,input,textarea{font:inherit}.app{min-height:100vh;padding-bottom:86px}.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);padding:max(12px,env(safe-area-inset-top)) 15px 9px}.brand{display:flex;align-items:center;justify-content:space-between;height:54px}.brandmain{display:flex;align-items:center;gap:9px}.brand img{width:34px;height:42px;object-fit:contain}.brand strong{font-size:21px}.yam{color:var(--red)}.round{border:0;background:var(--soft);color:var(--ink);width:42px;height:42px;border-radius:13px}.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}.chips{display:flex;gap:7px;padding:11px 15px 3px;overflow:auto}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;white-space:nowrap}.chip.on{background:var(--red);border-color:var(--red);color:#fff}.content{padding:13px 15px}.heading{display:flex;align-items:center;justify-content:space-between;margin:5px 1px 12px}.heading h2{font-size:18px;margin:0}.heading small{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{position:relative;border:1px solid var(--line);background:var(--card);border-radius:17px;padding:13px;min-height:145px;box-shadow:0 5px 16px #00000009}.note.red{background:#fff0f0;color:#181818}.note.gray{background:#e8e8eb;color:#181818}.note.yellow{background:#fff6ce;color:#181818}.note h3{font-size:15px;margin:0 0 8px;padding-left:24px}.note p{font-size:13px;line-height:1.65;margin:0;color:color-mix(in srgb,currentColor 72%,transparent);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.pin{position:absolute;top:8px;left:8px;border:0;background:none;color:var(--red);font-size:18px}.meta{position:absolute;bottom:10px;right:13px;left:13px;display:flex;gap:5px;flex-wrap:wrap;font-size:10px;color:var(--muted)}.tag{background:#ffffffb8;color:#444;border-radius:999px;padding:2px 6px}.empty{grid-column:1/-1;background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:45px 20px;text-align:center;color:var(--muted)}.empty img{height:58px;opacity:.55}.fab{position:fixed;left:22px;bottom:max(84px,calc(env(safe-area-inset-bottom) + 80px));z-index:30;width:58px;height:58px;border:0;border-radius:19px;background:linear-gradient(145deg,var(--red),var(--red2));color:#fff;font-size:31px;box-shadow:0 12px 28px #951a1d55}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:7px 5px max(7px,env(safe-area-inset-bottom))}.nav{border:0;background:none;color:var(--muted);font-size:10px}.nav b{display:block;font-size:20px;font-weight:400}.nav.on{color:var(--red)}.overlay{position:fixed;inset:0;z-index:80;background:#0007;display:none;align-items:flex-end}.overlay.show{display:flex}.panel{width:100%;max-height:96vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:15px 16px max(20px,env(safe-area-inset-bottom))}.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}.save{border:0;background:var(--red);color:#fff;border-radius:13px;padding:10px 18px;font-weight:700}.title,.body{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}.title{font-size:22px;font-weight:800;padding:15px 2px 8px}.body{font-size:16px;line-height:1.8;min-height:220px;resize:none}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line);padding-top:11px}.tool{border:0;background:var(--soft);color:var(--ink);border-radius:12px;padding:10px 3px;font-size:11px}.colors{display:flex;gap:10px;margin-top:14px}.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px #aaa}.sw.on{box-shadow:0 0 0 2px var(--red)}.drawer{position:fixed;inset:0;z-index:90;background:#0007;display:none}.drawer.show{display:block}.drawerbox{height:100%;width:min(84%,340px);background:var(--card);padding:max(20px,env(safe-area-inset-top)) 16px 20px;overflow:auto}.dbrand{text-align:center;padding:8px}.dbrand img{height:65px}.dbrand h2{margin:4px}.ditem{width:100%;border:0;background:none;color:var(--ink);text-align:right;padding:13px;border-radius:12px;margin:2px 0}.ditem.on{background:#fff0f0;color:var(--red);font-weight:700}.list{display:grid;gap:9px}.rowcard{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-left:8px}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--red);color:#fff}.ghost{background:var(--soft);color:var(--ink)}.lock{position:fixed;inset:0;z-index:150;background:linear-gradient(145deg,#421113,#160d0e);display:none;color:#fff;place-items:center}.lock.show{display:grid}.lockbox{text-align:center;width:min(90%,360px)}.lockbox img{height:80px}.dots{display:flex;justify-content:center;gap:12px;margin:22px}.pdot{width:14px;height:14px;border:1px solid #fff;border-radius:50%}.pdot.fill{background:#fff}.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:12px;justify-content:center}.key{width:70px;height:70px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff12;color:#fff;font-size:22px}.toast{position:fixed;z-index:200;left:50%;bottom:105px;transform:translateX(-50%);background:#1b1b1e;color:#fff;border-radius:999px;padding:10px 16px;display:none}.toast.show{display:block}@media(min-width:700px){.top,.chips,.content{max-width:900px;margin:auto}.grid{grid-template-columns:repeat(3,1fr)}.panel{max-width:720px;margin:auto}}</style></head><body><div id="lock" class="lock"><div class="lockbox"><img src="yam-logo.svg"><h2>Yam Notes</h2><p>أدخل رمز القفل</p><div id="dots" class="dots"></div><div id="keypad" class="keypad"></div></div></div><div class="app"><header class="top"><div class="brand"><div class="brandmain"><img src="yam-logo.svg"><strong><span class="yam">Yam</span> Notes</strong></div><button id="menu" class="round">☰</button></div><div class="search">⌕<input id="search" placeholder="ابحث في ملاحظاتك..."></div></header><div class="chips"><button class="chip on" data-filter="all">الكل</button><button class="chip" data-filter="pinned">المثبتة</button><button class="chip" data-filter="tasks">المهام</button><button class="chip" data-filter="red">الحمراء</button><button class="chip" data-filter="gray">الرمادية</button></div><main class="content"><div class="heading"><h2 id="heading">كل الملاحظات</h2><small id="count"></small></div><section id="grid" class="grid"></section></main><button id="add" class="fab">+</button><nav class="bottom"><button class="nav on" data-view="notes"><b>▤</b>الملاحظات</button><button class="nav" data-view="reminders"><b>◷</b>التذكيرات</button><button class="nav" data-view="archive"><b>▣</b>الأرشيف</button><button class="nav" data-view="more"><b>☰</b>المزيد</button></nav></div><div id="editor" class="overlay"><div class="panel"><div class="phead"><button id="close" class="round">×</button><b id="editHead">ملاحظة جديدة</b><button id="save" class="save">حفظ ✓</button></div><input id="title" class="title" placeholder="عنوان الملاحظة"><textarea id="body" class="body" placeholder="اكتب ملاحظتك هنا..."></textarea><div class="tools"><button id="pin" class="tool">☆ تثبيت</button><button id="task" class="tool">☐ قائمة مهام</button><button id="label" class="tool">◇ تصنيف</button><button id="remind" class="tool">◷ تذكير</button><button id="archive" class="tool">▣ أرشفة</button><button id="trash" class="tool">⌫ حذف</button><button id="share" class="tool">↗ مشاركة</button><button id="copy" class="tool">▢ نسخ</button></div><div class="colors"><button class="sw" data-color="white" style="background:#fff"></button><button class="sw" data-color="red" style="background:#ffdada"></button><button class="sw" data-color="gray" style="background:#d7d7db"></button><button class="sw" data-color="yellow" style="background:#ffe899"></button></div></div></div><div id="drawer" class="drawer"><div class="drawerbox"><div class="dbrand"><img src="yam-logo.svg"><h2><span class="yam">Yam</span> Notes Pro</h2><small>ملاحظاتك .. بشكل أذكى</small></div><button class="ditem on" data-go="notes">▤ كل الملاحظات</button><button class="ditem" data-go="pinned">☆ المثبتة</button><button class="ditem" data-go="categories">◇ التصنيفات</button><button class="ditem" data-go="reminders">◷ التذكيرات</button><button class="ditem" data-go="archive">▣ الأرشيف</button><button class="ditem" data-go="trash">⌫ المحذوفات</button><button class="ditem" data-go="settings">⚙ الإعدادات</button></div></div><div id="toast" class="toast"></div><script>const NK='yam.notes.pro.v3',SK='yam.notes.settings.v3';let edit=null,view='notes',filter='all',color='white',pinned=false,isTask=false,pinEntry='';const $=id=>document.getElementById(id);const settings=()=>{try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch{return{}}};const setSettings=s=>localStorage.setItem(SK,JSON.stringify(s));const load=()=>{try{return JSON.parse(localStorage.getItem(NK)||'[]')}catch{return[]}};const saveAll=a=>localStorage.setItem(NK,JSON.stringify(a));function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1300)}function dt(t){return new Date(t).toLocaleDateString('ar-IQ',{month:'short',day:'numeric'})}function isVisible(n){if(view==='notes'&&(n.archived||n.trashed))return false;if(view==='archive'&&(!n.archived||n.trashed))return false;if(view==='trash'&&!n.trashed)return false;if(view==='reminders'&&!n.reminder)return false;if(filter==='pinned'&&!n.pinned)return false;if(filter==='tasks'&&!n.task)return false;if(['red','gray'].includes(filter)&&n.color!==filter)return false;let q=$('search').value.trim().toLowerCase();return !q||(n.title+' '+n.text+' '+(n.label||'')).toLowerCase().includes(q)}function render(){if(view==='categories'){renderCategories();return}if(view==='settings'){renderSettings();return}let a=load().filter(isVisible).sort((x,y)=>(y.pinned-x.pinned)||(y.updated-x.updated));let names={notes:'كل الملاحظات',archive:'الأرشيف',trash:'المحذوفات',reminders:'التذكيرات'};$('heading').textContent=names[view]||'كل الملاحظات';$('count').textContent=a.length?a.length+' ملاحظة':'';$('grid').innerHTML=a.length?a.map(n=>`<article class="note ${n.color||''}" onclick="openNote('${n.id}')"><button class="pin" onclick="event.stopPropagation();quickPin('${n.id}')">${n.pinned?'★':'☆'}</button><h3>${esc(n.title||'ملاحظة')}</h3><p>${n.task?'☑ ':''}${esc(n.text)}</p><div class="meta">${n.label?`<span class="tag">${esc(n.label)}</span>`:''}${n.reminder?'<span>◷ تذكير</span>':''}<span>${dt(n.updated)}</span></div></article>`).join(''):`<div class="empty"><img src="yam-logo.svg"><p>ماكو ملاحظات هنا بعد</p><small>اضغط + حتى تضيف أول فكرة</small></div>`}function renderCategories(){let m={};load().filter(n=>!n.trashed).forEach(n=>{let x=n.label||'بدون تصنيف';m[x]=(m[x]||0)+1});$('heading').textContent='التصنيفات';$('count').textContent=Object.keys(m).length+' تصنيف';$('grid').innerHTML=`<div class="empty" style="text-align:right"><div class="list">${Object.entries(m).map(([k,v])=>`<div class="rowcard"><span>◇ ${esc(k)}</span><b>${v}</b></div>`).join('')||'<p>لا توجد تصنيفات بعد</p>'}</div><button class="btn" style="margin-top:14px" onclick="toast('أضف التصنيف من داخل الملاحظة')">+ إضافة تصنيف</button></div>`}function renderSettings(){let s=settings();$('heading').textContent='الإعدادات';$('count').textContent='';$('grid').innerHTML=`<div class="empty" style="text-align:right"><div class="list"><div class="rowcard"><span>المظهر الداكن</span><button class="btn ghost" onclick="toggleDark()">${s.dark?'مفعّل':'متوقف'}</button></div><div class="rowcard"><span>قفل التطبيق</span><button class="btn ghost" onclick="toggleLock()">${s.pin?'مفعّل':'متوقف'}</button></div><div class="rowcard"><span>نسخ احتياطي محلي</span><button class="btn ghost" onclick="backup()">نسخ</button></div><div class="rowcard"><span>استعادة نسخة</span><button class="btn ghost" onclick="restore()">استعادة</button></div><div class="rowcard"><span>الإصدار</span><b>3.0.0</b></div></div></div>`}function openEditor(n){edit=n?.id||null;color=n?.color||'white';pinned=!!n?.pinned;isTask=!!n?.task;$('title').value=n?.title||'';$('body').value=n?.text||'';$('editHead').textContent=n?'تعديل الملاحظة':'ملاحظة جديدة';$('pin').textContent=pinned?'★ مثبتة':'☆ تثبيت';$('task').textContent=isTask?'☑ قائمة مهام':'☐ قائمة مهام';document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.color===color));$('editor').classList.add('show')}function openNote(id){let n=load().find(x=>String(x.id)===String(id));if(n)openEditor(n)}function closeEditor(){$('editor').classList.remove('show')}function store(){let title=$('title').value.trim(),text=$('body').value.trim();if(!title&&!text)return toast('اكتب ملاحظة أولاً');let a=load(),now=Date.now();if(edit){let i=a.findIndex(x=>String(x.id)===String(edit));if(i>=0)a[i]={...a[i],title,text,color,pinned,task:isTask,updated:now}}else a.unshift({id:String(now),title,text,color,pinned,task:isTask,label:'',reminder:false,archived:false,trashed:false,created:now,updated:now});saveAll(a);closeEditor();render();toast('تم الحفظ')}function mutate(fn,msg){if(!edit)return toast('احفظ الملاحظة أولاً');let a=load(),i=a.findIndex(x=>String(x.id)===String(edit));if(i<0)return;fn(a[i]);a[i].updated=Date.now();saveAll(a);closeEditor();render();toast(msg)}function quickPin(id){let a=load(),i=a.findIndex(x=>String(x.id)===String(id));if(i>=0){a[i].pinned=!a[i].pinned;a[i].updated=Date.now();saveAll(a);render()}}function setView(v){view=v;filter='all';document.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('on',i===0));$('drawer').classList.remove('show');render()}function toggleDark(){let s=settings();s.dark=!s.dark;setSettings(s);document.body.classList.toggle('dark',s.dark);renderSettings()}function toggleLock(){let s=settings();if(s.pin){if(confirm('إلغاء قفل التطبيق؟')){delete s.pin;setSettings(s);renderSettings()}}else{let p=prompt('اختر رمزاً من 4 أرقام');if(/^\d{4}$/.test(p||'')){s.pin=p;setSettings(s);toast('تم تفعيل القفل');renderSettings()}else toast('الرمز لازم 4 أرقام')}}function backup(){let data=btoa(unescape(encodeURIComponent(JSON.stringify({notes:load(),settings:settings()}))));navigator.clipboard?.writeText(data);toast('تم نسخ النسخة الاحتياطية')}function restore(){let x=prompt('الصق رمز النسخة الاحتياطية');if(!x)return;try{let d=JSON.parse(decodeURIComponent(escape(atob(x))));if(Array.isArray(d.notes))saveAll(d.notes);if(d.settings)setSettings(d.settings);toast('تمت الاستعادة');render()}catch{toast('النسخة غير صالحة')}}function initLock(){let s=settings();document.body.classList.toggle('dark',!!s.dark);if(!s.pin)return;pinEntry='';$('lock').classList.add('show');drawDots();let keys=['1','2','3','4','5','6','7','8','9','⌫','0','✓'];$('keypad').innerHTML=keys.map(k=>`<button class="key" onclick="keyPress('${k}')">${k}</button>`).join('')}function drawDots(){$('dots').innerHTML=[0,1,2,3].map(i=>`<i class="pdot ${i<pinEntry.length?'fill':''}"></i>`).join('')}function keyPress(k){if(k==='⌫')pinEntry=pinEntry.slice(0,-1);else if(k==='✓'){if(pinEntry===settings().pin){$('lock').classList.remove('show');pinEntry=''}else{pinEntry='';toast('رمز غير صحيح')}}else if(pinEntry.length<4)pinEntry+=k;drawDots();if(pinEntry.length===4&&pinEntry===settings().pin){$('lock').classList.remove('show');pinEntry=''}}$('add').onclick=()=>openEditor();$('close').onclick=closeEditor;$('editor').onclick=e=>{if(e.target===$('editor'))closeEditor()};$('save').onclick=store;$('pin').onclick=()=>{pinned=!pinned;$('pin').textContent=pinned?'★ مثبتة':'☆ تثبيت'};$('task').onclick=()=>{isTask=!isTask;$('task').textContent=isTask?'☑ قائمة مهام':'☐ قائمة مهام'};document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{color=s.dataset.color;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===s))});$('label').onclick=()=>{let v=prompt('اسم التصنيف');if(v!==null)mutate(n=>n.label=v.trim(),'تم التصنيف')};$('remind').onclick=()=>mutate(n=>n.reminder=!n.reminder,'تم تحديث التذكير');$('archive').onclick=()=>mutate(n=>n.archived=!n.archived,'تم تحديث الأرشيف');$('trash').onclick=()=>mutate(n=>n.trashed=!n.trashed,view==='trash'?'تم الاسترجاع':'تم النقل للمحذوفات');$('copy').onclick=()=>{navigator.clipboard?.writeText($('title').value+'\n'+$('body').value);toast('تم النسخ')};$('share').onclick=()=>{let t=$('title').value+'\n'+$('body').value;if(navigator.share)navigator.share({title:$('title').value,text:t});else{navigator.clipboard?.writeText(t);toast('تم نسخ المحتوى للمشاركة')}};$('search').oninput=render;document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));render()});document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{let v=n.dataset.view;if(v==='more')return $('drawer').classList.add('show');setView(v);document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x===n))});$('menu').onclick=()=>$('drawer').classList.add('show');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('show')};document.querySelectorAll('.ditem').forEach(d=>d.onclick=()=>{let g=d.dataset.go;if(g==='pinned'){view='notes';filter='pinned';$('drawer').classList.remove('show');render()}else setView(g)});initLock();render();</script></body></html>
